
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b70">
  <title>KV NDA Tax Calculator</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f9;
      color: #17365d;
    }
    header {
      background: #123b70;
      color: white;
      padding: 16px;
      text-align: center;
    }
    header h2 { margin: 0 0 5px; }
    header p { margin: 0; font-size: 13px; }
    main {
      max-width: 1100px;
      margin: auto;
      padding: 12px;
    }
    .notice {
      background: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 170px);
      min-height: 650px;
      border: 0;
      border-radius: 8px;
      background: white;
    }
    footer {
      text-align: center;
      font-size: 12px;
      padding: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h2>KV NDA Tax Calculator</h2>
    <p>PM SHRI Kendriya Vidyalaya NDA, Pune</p>
    <p>Financial Year 2026–27</p>
  </header>

  <main>
    <div class="notice">
      Employee Income Tax Calculator – Please verify using your registered Gmail ID.
    </div>

    <iframe
      src="https://script.google.com/macros/s/AKfycbwik4YejYW3GlAQYdwcDnI0Vlu2iwGXsnCBTNTiqck1oFgxbsj9HV6MRthd6rx_lmqZXQ/exec"
      title="KV NDA Employee Income Tax Calculator"
      allow="clipboard-read; clipboard-write">
    </iframe>
  </main>

  <footer>
    © PM SHRI Kendriya Vidyalaya NDA, Pune
  </footer>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("Service worker:", error));
      });
    }
  </script>
</body>
</html>
